<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kinder — ручной свайпинг</title><link rel="stylesheet" href="./styles.css"></head><body><main class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">K</span><span>Kinder</span></div><div class="matches-pill">♥ <span id="matchesCount">10</span></div></header><section class="toolbar"><button class="city-button" id="cityButton" type="button"><span class="pin">⌖</span><span><small>Ищем в</small><strong id="cityName">Амстердам</strong></span><span class="chevron">⌄</span></button></section><section class="swipe-area"><div class="status" id="status">Новая рекомендация</div><article class="card" id="profileCard"><img id="profilePhoto" src="" alt="Фото анкеты"><div class="card-shade"></div><div class="card-info"><div class="name-row"><h1 id="profileName">Загрузка...</h1><span id="profileAge"></span></div><p id="profileMeta"></p><p class="bio" id="profileBio"></p></div><div class="photo-dots" id="photoDots"></div></article><div class="actions"><button class="action action-dislike" id="dislikeButton" type="button">×</button><button class="action action-like" id="likeButton" type="button">♥</button></div><p class="hint">Можно использовать кнопки или клавиши ← →</p></section><section class="result-panel hidden" id="emptyState"><div class="empty-icon">♡</div><h2>Рекомендации закончились</h2><p>Попробуй выбрать другой город — мы загрузим новую подборку.</p><button class="primary-button" id="changeCityButton" type="button">Сменить город</button></section></main><dialog id="cityDialog"><form method="dialog" class="city-dialog"><div class="dialog-head"><div><small>Место поиска</small><h2>Выбери город</h2></div><button class="close" value="cancel" type="submit">×</button></div><div class="city-options" id="cityOptions"></div><label class="custom-city">Или введи свой город<input id="customCity" type="text" placeholder="Например, Нью-Йорк"></label><button class="primary-button" id="applyCityButton" value="default" type="submit">Начать поиск здесь</button></form></dialog><div class="toast" id="toast" role="status"></div><script src="./app.js"></script></body></html>
