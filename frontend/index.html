<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kinder</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<main class="app-shell">
<section id="authScreen" class="auth-screen">
  <div class="auth-logo"><span class="brand-mark">K</span><h1>Kinder</h1></div>
  <p>Знакомства, которые начинаются с одного свайпа.</p>
  <div id="authChoice">
    <button class="primary-button" id="tokenAuthButton" type="button">Войти с Tinder token</button>
    <button class="secondary-button" id="phoneAuthButton" type="button">Войти по телефону</button>
  </div>
  <form id="tokenForm" class="auth-form hidden">
    <label>Tinder token<input id="tokenInput" type="password" autocomplete="off" required></label>
    <button class="primary-button" type="button">Войти</button>
  </form>
  <form id="phoneForm" class="auth-form hidden">
    <label>Номер телефона<input id="phoneInput" type="tel" placeholder="+31..." required></label>
    <button class="primary-button" type="button">Получить код</button>
  </form>
  <form id="codeForm" class="auth-form hidden">
    <label>Код из SMS<input id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button class="primary-button" type="button">Подтвердить</button>
  </form>
  <p class="auth-note">Для разработки можно использовать тестовый режим backend.</p>
</section>

<section id="appScreen" class="hidden">
<header class="topbar"><div class="brand"><span class="brand-mark">K</span><span>Kinder</span></div><div class="topbar-actions"><div class="matches-pill">♥ <span id="matchesCount">0</span></div><button class="logout-button" id="logoutButton" type="button">Выйти</button></div></header>
<section class="toolbar"><div class="toolbar-actions"><button class="city-button" id="cityButton" type="button"><span class="pin">⌖</span><span><small>Ищем в</small><strong id="cityName">—</strong></span><span class="chevron">⌄</span></button><button class="primary-button autoswipe-button hidden" id="autoSwipeButton" type="button">🚀 AutoSwipe</button></div></section>
<section class="swipe-area"><div class="status" id="status">Загрузка...</div><article class="card" id="profileCard"><img id="profilePhoto" src="" alt="Фото анкеты"><div class="card-shade"></div><div class="card-info"><div class="name-row"><h1 id="profileName"></h1><span id="profileAge"></span></div><p id="profileMeta"></p><p class="bio" id="profileBio"></p></div><div class="photo-dots" id="photoDots"></div></article>
<div class="actions" id="actions"><button class="action action-dislike" id="dislikeButton" type="button">×</button><button class="action action-like" id="likeButton" type="button">♥</button></div><p class="hint" id="swipeHint">← → или кнопки</p></section>
<section class="result-panel hidden" id="emptyState"><div class="empty-icon">♡</div><h2>Рекомендации закончились</h2><p id="swipeResultText">Попробуй выбрать другой город.</p><button class="secondary-button" id="changeCityButton" type="button">Сменить город</button></section>
</section>
</main>
<dialog id="cityDialog"><form method="dialog" class="city-dialog"><div class="dialog-head"><div><small>Место поиска</small><h2>Выбери город</h2></div><button class="close" value="cancel" type="submit">×</button></div><div class="city-options" id="cityOptions"></div><label class="custom-city">Или введи свой город<input id="customCity" type="text" placeholder="Например, Нью-Йорк"></label><button class="primary-button" id="applyCityButton" value="default" type="submit">Начать поиск здесь</button></form></dialog>
<div class="toast" id="toast" role="status"></div><script src="./app.js?v=auth2"></script></body></html>
